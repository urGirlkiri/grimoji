name: Compress Media

on:
  push:
    branches:
      - main
    paths:
      - '**/*.m4a'
      - '**/*.png'
      - '**/*.svg'
      - '**/*.json'
      - '!**/screenshots/**' 

jobs:
  compress-media:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pngquant jq bc
          npm install -g svgo

      - name: Initial Size
        run: |
          echo "START_SIZE_MB=$(du -sh . | cut -f1)" >> $GITHUB_ENV
          echo "START_SIZE_KB=$(du -sk . | cut -f1)" >> $GITHUB_ENV

      - name: Compress Audio 
        run: |
          START_AUDIO_KB=$(du -sk . | cut -f1)
          
          find . -type f -name "*.m4a" -not -path "*/screenshots/*" | while read -r file; do
            [ ! -f "$file" ] && continue
            bitrate=$(ffprobe -v error -select_streams a:0 -show_entries stream=bit_rate -of default=noprint_wrappers=1:nokey=1 "$file" || echo "unknown")
            if [ "$bitrate" != "unknown" ] && [ "$bitrate" -le 50000 ]; then
              echo "M4A already optimized, skipping: $file"
            else
              orig_size=$(stat -c%s "$file" || echo "0")
              if ffmpeg -nostdin -i "$file" -c:a aac -b:a 48k -ac 1 -y "${file%.*}.tmp.m4a" > /dev/null 2>&1; then
                mv "${file%.*}.tmp.m4a" "$file"
                new_size=$(stat -c%s "$file" || echo "0")
                echo "M4A Optimized: $file | $((orig_size / 1024))KB -> $((new_size / 1024))KB"
              else
                echo "Failed to compress $file, skipping."
                rm -f "${file%.*}.tmp.m4a"
              fi
            fi
          done
          END_AUDIO_KB=$(du -sk . | cut -f1)
          AUDIO_SAVED_KB=$((START_AUDIO_KB - END_AUDIO_KB))
          AUDIO_SAVED_MB=$(echo "scale=2; $AUDIO_SAVED_KB / 1024" | bc 2>/dev/null || echo "0")
          AUDIO_PCT=$(echo "scale=1; $AUDIO_SAVED_KB * 100 / $START_AUDIO_KB" | bc 2>/dev/null || echo "0")
          echo "Audio: reduced by ~$AUDIO_SAVED_MB MB ($AUDIO_SAVED_KB KB, ${AUDIO_PCT}% reduction)"

      - name: Compress Images
        run: |
          START_IMAGES_KB=$(du -sk . | cut -f1)
          find . -type f -name "*.png" -not -path "*/screenshots/*" | while read -r img; do
            [ ! -f "$img" ] && continue
            pngquant --quality=65-80 --skip-if-larger --ext .png --force "$img" || true
          done
          echo "All PNGs optimized."
          END_IMAGES_KB=$(du -sk . | cut -f1)
          IMAGES_SAVED_KB=$((START_IMAGES_KB - END_IMAGES_KB))
          IMAGES_SAVED_MB=$(echo "scale=2; $IMAGES_SAVED_KB / 1024" | bc 2>/dev/null || echo "0")
          IMAGES_PCT=$(echo "scale=1; $IMAGES_SAVED_KB * 100 / $START_IMAGES_KB" | bc 2>/dev/null || echo "0")
          echo "Images: reduced by ~$IMAGES_SAVED_MB MB ($IMAGES_SAVED_KB KB, ${IMAGES_PCT}% reduction)"

      - name: Optimize Vectors 
        run: |
          START_VECTORS_KB=$(du -sk . | cut -f1)
          find . -type f -name "*.svg" -not -path "*/screenshots/*" | while read -r file; do
            [ ! -f "$file" ] && continue
            svgo --quiet "$file"
          done
          echo "All SVGs optimized."
          END_VECTORS_KB=$(du -sk . | cut -f1)
          VECTORS_SAVED_KB=$((START_VECTORS_KB - END_VECTORS_KB))
          VECTORS_SAVED_MB=$(echo "scale=2; $VECTORS_SAVED_KB / 1024" | bc 2>/dev/null || echo "0")
          VECTORS_PCT=$(echo "scale=1; $VECTORS_SAVED_KB * 100 / $START_VECTORS_KB" | bc 2>/dev/null || echo "0")
          echo "Vectors: reduced by ~$VECTORS_SAVED_MB MB ($VECTORS_SAVED_KB KB, ${VECTORS_PCT}% reduction)"

      - name: Minify Lottie 
        run: |
          START_LOTTIE_KB=$(du -sk . | cut -f1)
          find . -type f -name "*.json" -not -path "*/screenshots/*" | while read -r file; do
            if jq -c . "$file" > "${file}.tmp" 2>/dev/null; then
              mv "${file}.tmp" "$file"
            else
              rm -f "${file}.tmp"
            fi
          done
          echo "All JSONs minified."
          END_LOTTIE_KB=$(du -sk . | cut -f1)
          LOTTIE_SAVED_KB=$((START_LOTTIE_KB - END_LOTTIE_KB))
          LOTTIE_SAVED_MB=$(echo "scale=2; $LOTTIE_SAVED_KB / 1024" | bc 2>/dev/null || echo "0")
          LOTTIE_PCT=$(echo "scale=1; $LOTTIE_SAVED_KB * 100 / $START_LOTTIE_KB" | bc 2>/dev/null || echo "0")
          echo "Lottie: reduced by ~$LOTTIE_SAVED_MB MB ($LOTTIE_SAVED_KB KB, ${LOTTIE_PCT}% reduction)"

      - name: Summary Report
        run: |
          END_SIZE_MB=$(du -sh . | cut -f1)
          END_SIZE_KB=$(du -sk . | cut -f1)
          SAVED_KB=$((START_SIZE_KB - END_SIZE_KB))
          SAVED_MB=$(echo "scale=2; $SAVED_KB / 1024" | bc 2>/dev/null || echo "0")
          TOTAL_PCT=$(echo "scale=1; $SAVED_KB * 100 / $START_SIZE_KB" | bc 2>/dev/null || echo "0")
          
          echo "=========================================="
          echo "🏁 OPTIMIZATION COMPLETE!"
          echo "📦 Starting Size: $START_SIZE_MB"
          echo "📦 Ending Size:   $END_SIZE_MB"
          echo "💎 Total Space Saved: ~$SAVED_MB MB ($SAVED_KB KB, ${TOTAL_PCT}% reduction)"
          echo "=========================================="

      - name: Commit and Push 
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "chore: cleaned and compress all media [skip ci]"
            git push
          else
            echo "Everything is already  compressed :}"
          fi