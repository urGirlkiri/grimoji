name:  Production Release 

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  detect-version-change:
    name: Check New Version
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check pubspec version
        id: check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            current=$(grep '^version:' pubspec.yaml | awk '{print $2}')
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "version=$current" >> $GITHUB_OUTPUT
            exit 0
          fi
          current=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          previous=$(git show HEAD~1:pubspec.yaml 2>/dev/null | grep '^version:' | awk '{print $2}' || echo "")
          if [ "$current" != "$previous" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "version=$current" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

  build-and-release:
    name: Android, Releases, Web
    environment: release
    needs: detect-version-change
    if: github.ref == 'refs/heads/main' && needs.detect-version-change.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Install Linux Build Requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            liblzma-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Install Dependencies
        run: flutter pub get

      - name: Create .env file
        run: |
          cat << EOF > .env
          WINDOWS_USER_MODEL_ID=${{ secrets.WINDOWS_USER_MODEL_ID }}
          WINDOWS_NOTIFICATION_GUID=${{ secrets.WINDOWS_NOTIFICATION_GUID }}
          EOF

      - name: Run Tests
        run: flutter test

      - name: Decode Android Secrets
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > upload-keystore.jks

      - name: Create key.properties
        run: |
          cat << EOF > android/key.properties
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=../upload-keystore.jks
          EOF

      - name: Optimize Gradle
        run: |
          echo "org.gradle.daemon=false" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx3072m" >> android/gradle.properties

      - name: Build Web
        run: flutter build web --base-href "/"

      - name: Create .env file for Web
        run: |
          cat << EOF > build/web/assets/.env
          EOF

      - name: Build Android (AAB & APK)
        run: |
          flutter build appbundle --release
          flutter build apk --release

      - name: Build Linux Desktop (Bundle)
        run: |
          flutter config --enable-linux-desktop
          flutter build linux --release

      - name: Package .Deb
        run: |
          mkdir -p debian_build/usr/share/grimoji debian_build/usr/bin debian_build/DEBIAN
          cp -r build/linux/x64/release/bundle/* debian_build/usr/share/grimoji/
          # FIX: Rename binary from Grimoji to grimoji if needed
          if [ -f debian_build/usr/share/grimoji/Grimoji ]; then mv debian_build/usr/share/grimoji/Grimoji debian_build/usr/share/grimoji/grimoji; fi
          ln -s /usr/share/grimoji/grimoji debian_build/usr/bin/grimoji
          VERSION=${{ needs.detect-version-change.outputs.version }}
          cat <<EOF > debian_build/DEBIAN/control
          Package: grimoji
          Version: $VERSION
          Architecture: amd64
          Maintainer: Kiri <support@grimoji.io>
          Description: Grimoji: Mix & Match Emojis Gothic Alchemy.
          EOF
          dpkg-deb --build debian_build linux-amd64.deb

      - name: Package AppImage
        run: |
          wget -O appimagetool "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp -r build/linux/x64/release/bundle/* AppDir/usr/bin/
          # FIX: Rename binary from Grimoji to grimoji if needed
          if [ -f AppDir/usr/bin/Grimoji ]; then mv AppDir/usr/bin/Grimoji AppDir/usr/bin/grimoji; fi
          cat <<EOF > AppDir/grimoji.desktop
          [Desktop Entry]
          Name=Grimoji
          Exec=grimoji
          Icon=grimoji
          Type=Application
          Categories=Game;LogicGame;
          EOF
          cp assets/icons/512x512.png AppDir/grimoji.png
          chmod +x AppDir/usr/bin/grimoji
          ./appimagetool --appimage-extract-and-run AppDir linux-x86_64.AppImage

      - name: Deploy to GitHub Pages
        continue-on-error: true 
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          cname: play.grimoji.io
      - name: Upload to Google Play
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: io.grimoji.game
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: beta
          status: completed

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.detect-version-change.outputs.version }}
          name: "v${{ needs.detect-version-change.outputs.version }}"
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            linux-amd64.deb
            linux-x86_64.AppImage
            build\windows\x64\runner\Release\windows.msix
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux Bundle for Flatpak
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: build/linux/x64/release/bundle/

  build-snap:
    environment: release
    needs: build-and-release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true 
    steps:
      - uses: actions/checkout@v4

      - name: Create .env file for Snap
        run: |
          cat << EOF > .env
          EOF

      - name: Prepare Snap Metadata
        run: |
          rm -rf snap/gui
          mkdir -p snap/gui
          
          cp assets/icons/512x512.png snap/gui/grimoji.png
          
          cat <<EOF > snap/gui/grimoji.desktop
          [Desktop Entry]
          Name=Grimoji
          Comment=Gothic alchemy puzzle game
          Exec=grimoji
          Icon=\${SNAP}/meta/gui/grimoji.png
          Terminal=false
          Type=Application
          Categories=Game;Puzzle;
          EOF

          # Create the Metainfo file
          cat <<EOF > snap/gui/grimoji.metainfo.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <component type="desktop-application">
            <id>io.grimoji.game</id>
            <name>Grimoji</name>
            <summary>Mix &amp; Match Emojis</summary>
            <metadata_license>FSFAP</metadata_license>
            <project_license>GPL-3.0-or-later</project_license>
            <description>
              <p>The ultimate gothic alchemy puzzle game.</p>
            </description>
            <screenshots>
              <screenshot type="default">
                <image>https://raw.githubusercontent.com/urGirlkiri/grimoji/main/assets/screenshots/screen1.png</image>
                <image>https://raw.githubusercontent.com/urGirlkiri/grimoji/main/assets/screenshots/screen2.png</image>
                <image>https://raw.githubusercontent.com/urGirlkiri/grimoji/main/assets/screenshots/screen3.png</image>
                <image>https://raw.githubusercontent.com/urGirlkiri/grimoji/main/assets/screenshots/screen4.png</image>
                <image>https://raw.githubusercontent.com/urGirlkiri/grimoji/main/assets/screenshots/screen5.png</image>
              </screenshot>
            </screenshots>
          </component>
          EOF
      - uses: subosito/flutter-action@v2
      - uses: snapcore/action-build@v1
        id: snap-build
      - uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_TOKEN }}
        with:
          snap: ${{ steps.snap-build.outputs.snap }}
          release: edge

  build-windows:
    environment: release
    needs: [build-and-release, detect-version-change]
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2

      - name: Create .env file for Windows
        run: |
          echo WINDOWS_USER_MODEL_ID=${{ secrets.WINDOWS_USER_MODEL_ID }} > .env
          echo WINDOWS_NOTIFICATION_GUID=${{ secrets.WINDOWS_NOTIFICATION_GUID }} >> .env

      - name: Build MSIX
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows .
          flutter pub get

      - name: MSVC coroutine workaround
        run: |
          $content = [System.IO.File]::ReadAllText('windows\CMakeLists.txt')
          $content = $content -replace '(# Use Unicode for all projects\.\r?\nadd_definitions\(-DUNICODE -D_UNICODE\))', '$1
          if(MSVC)
            add_compile_definitions(_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)
          endif()'
          [System.IO.File]::WriteAllText('windows\CMakeLists.txt', $content, [System.Text.UTF8Encoding]::new($false))

      - name: Build MSIX
        run: |
          flutter build windows --release
          dart run msix:create --store
          ren build\windows\x64\runner\Release\*.msix windows.msix
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.detect-version-change.outputs.version }}
          files: build\windows\x64\runner\Release\windows.msix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-flatpak:
    environment: release
    needs: [build-and-release, detect-version-change]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: bilelmoussaoui/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Linux Bundle
        uses: actions/download-artifact@v4
        with:
          name: linux-bundle
          path: flatpak/app-dir/

      - name: Create .env file for Windows
        run: |
          cat << EOF > flatpak/app-dir/data/flutter_assets/.env
          EOF
          
      - name: Copy Desktop and Icon Files
        run: |
          cp assets/icons/512x512.png flatpak/io.grimoji.game.png
          cat <<EOF > flatpak/io.grimoji.game.desktop
          [Desktop Entry]
          Name=Grimoji
          Comment=Gothic alchemy puzzle game
          Exec=grimoji
          Icon=io.grimoji.game
          Terminal=false
          Type=Application
          Categories=Game;Puzzle;
          Keywords=alchemy;emoji;2048;
          EOF
      
      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: linux.flatpak
          manifest-path: flatpak/io.grimoji.game.yml
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.detect-version-change.outputs.version }}
          files: linux.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: build-macos
    environment: release
    needs: [build-and-release, detect-version-change]
    if: github.ref == 'refs/heads/main' && needs.detect-version-change.outputs.changed == 'true'
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Create .env file for macOS
        run: touch .env

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build macOS Release
        run: flutter build macos --release

      - name: Package macOS App
        run: |
          cd build/macos/Build/Products/Release
          zip -q -r ../../../../../macos.zip *.app

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.detect-version-change.outputs.version }}
          files: macos.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trigger-codemagic:
    name: build-apple
    environment: release
    needs: [build-and-release, detect-version-change]
    if: github.ref == 'refs/heads/main' && needs.detect-version-change.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger iOS and macOS TestFlight builds on Codemagic
        env:
          CODEMAGIC_API_TOKEN: ${{ secrets.CODEMAGIC_API_TOKEN }}
          CODEMAGIC_APP_ID: ${{ secrets.CODEMAGIC_APP_ID }}
        run: |
          for WORKFLOW in ios-testflight macos-testflight; do
            echo "Triggering $WORKFLOW on Codemagic..."
            curl -s -X POST \
              -H "x-auth-token: $CODEMAGIC_API_TOKEN" \
              -H "Content-Type: application/json" \
              https://api.codemagic.io/builds \
              -d "{\"appId\":\"$CODEMAGIC_APP_ID\",\"workflowId\":\"$WORKFLOW\",\"branch\":\"main\"}"
          done