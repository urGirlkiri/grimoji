workflows:
  ios-simulator-preview:
    name: iOS Preview Build 
    instance_type: mac_mini_m1
    max_build_duration: 30
    
    triggering:
      events:
        - push
        - pull_request 
      branch_patterns:
        - pattern: staging
          include: true
        - pattern: main
          include: true

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
        - $HOME/Library/Developer/Xcode/DerivedData/CompilationCache.noindex
          
    environment:
      groups:
        - Deploy 
      flutter: stable
    scripts:
      - name: Create .env file for Flutter
        script: |
          touch .env

      - name: Fetch packages
        script: flutter pub get

      - name: Build iOS App
        script: flutter build ios --simulator

      - name: Zip the .app for Appetize.io
        script: |
          cd build/ios/iphonesimulator
          zip -q -r grimoji_ios_preview.zip Runner.app
          echo "Zip file created successfully!"

      - name: Upload to Appetize.io
        script: |
          echo "Uploading zip to Appetize..."
          
          if [ -z "$APPETIZE_API_TOKEN" ]; then
            echo "❌ ERROR: APPETIZE_API_TOKEN is empty!"
            exit 1
          fi

          RESPONSE=$(curl -s -X POST "https://api.appetize.io/v1/apps" \
            -H "X-API-KEY: $APPETIZE_API_TOKEN" \
            -F "file=@build/ios/iphonesimulator/grimoji_ios_preview.zip" \
            -F "platform=ios")
          
          PUBLIC_URL=$(echo $RESPONSE | jq -r '.publicURL')
          
          if [ "$PUBLIC_URL" = "null" ]; then
            echo "❌ Upload Failed."
            echo "$RESPONSE"
            exit 1
          else
            echo "========================================================"
            echo "🚀 SUCCESS! Appetize Link: $PUBLIC_URL"
            echo "========================================================"
            
            if [ -n "$GITHUB_PAT" ]; then
              if [ "$CM_PULL_REQUEST" = "true" ]; then
                echo "Posting preview link to Pull Request #$CM_PULL_REQUEST_NUMBER..."
                curl -s -L \
                  -X POST \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: Bearer $GITHUB_PAT" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  https://api.github.com/repos/$CM_REPO_SLUG/issues/$CM_PULL_REQUEST_NUMBER/comments \
                  -d "{\"body\":\"**IOS Preview Bot** ✨\n\nChanges are ready to test on iOS!\n🎮 **[Click here to play on Appetize.io]($PUBLIC_URL)**\"}"
              
              else
                echo "Posting preview link to Commit $CM_COMMIT..."
                curl -s -L \
                  -X POST \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: Bearer $GITHUB_PAT" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  https://api.github.com/repos/$CM_REPO_SLUG/commits/$CM_COMMIT/comments \
                  -d "{\"body\":\"**IOS Preview Bot** ✨\n\nStaging branch updated!\n🎮 **[Click here to play on Appetize.io]($PUBLIC_URL)**\"}"
              fi
            else
              echo "⚠️ GITHUB_PAT not found. Skipping GitHub comment."
            fi
          fi

    artifacts:
      - build/ios/iphonesimulator/grimoji_ios_preview.zip

  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m1
    max_build_duration: 60

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    environment:
      groups:
        - Apple
        - Deploy
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Fetch packages
        script: flutter pub get

      - name: Install iOS Pods
        script: |
          cd ios
          pod install --repo-update

      - name: Initialize Keychain
        script: keychain initialize

      - name: Prepare Certificate Key
        script: |
          CERT_KEY_PATH="$CM_BUILD_DIR/cert_key.pem"
          if [ -n "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            printf '%s\n' "$CERTIFICATE_PRIVATE_KEY" > "$CERT_KEY_PATH"
          else
            openssl genrsa -out "$CERT_KEY_PATH" 2048
            echo "⚠️ Set CERTIFICATE_PRIVATE_KEY to this value for future builds:"
            base64 < "$CERT_KEY_PATH"
          fi

      - name: Auto-fetch Apple Signing Files
        script: |
          app-store-connect fetch-signing-files "io.grimoji.game" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@file:"$CM_BUILD_DIR/cert_key.pem" \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --private-key=@env:APP_STORE_CONNECT_PRIVATE_KEY

      - name: Apply Certificates to Xcode
        script: |
          keychain add-certificates
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          flutter build ipa --release

      - name: Upload IPA to GitHub Release
        script: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')

          echo "Attempting to upload IPA to GitHub Release v$VERSION..."

          mv build/ios/ipa/*.ipa build/ios/ipa/ios.ipa
          GH_TOKEN=$GITHUB_PAT gh release upload "v$VERSION" build/ios/ipa/ios.ipa --clobber

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        submit_to_testflight: true
        submit_to_app_store: false

  macos-testflight:
    name: macOS TestFlight
    instance_type: mac_mini_m1
    max_build_duration: 60

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    environment:
      groups:
        - Apple
      flutter: stable
      xcode: latest

    scripts:
      - name: Fetch packages
        script: flutter pub get

      - name: Initialize Keychain
        script: keychain initialize

      - name: Prepare Certificate Key
        script: |
          CERT_KEY_PATH="$CM_BUILD_DIR/cert_key.pem"
          if [ -n "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            printf '%s\n' "$CERTIFICATE_PRIVATE_KEY" > "$CERT_KEY_PATH"
          else
            openssl genrsa -out "$CERT_KEY_PATH" 2048
            echo "⚠️ Set CERTIFICATE_PRIVATE_KEY to this value for future builds:"
            base64 < "$CERT_KEY_PATH"
          fi

      - name: Auto-fetch Mac Signing Files
        script: |
          app-store-connect fetch-signing-files "io.grimoji.game" \
            --type MAC_APP_STORE \
            --create \
            --certificate-key=@file:"$CM_BUILD_DIR/cert_key.pem" \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --private-key=@env:APP_STORE_CONNECT_PRIVATE_KEY

      - name: Apply Certificates to Xcode
        script: |
          keychain add-certificates
          xcode-project use-profiles

      - name: Build macOS App
        script: flutter build macos --release

      - name: Package for Mac App Store
        script: |
          INSTALLER_CERT=$(security find-certificate -c "3rd Party Mac Developer Installer" -p | openssl x509 -subject -noout | sed 's/subject=.*CN=\(.*\)/\1/' | sed 's/^\///')

          xcrun productbuild --component build/macos/Build/Products/Release/grimoji.app /Applications --sign "$INSTALLER_CERT" grimoji.pkg

    artifacts:
      - grimoji.pkg

    publishing:
      app_store_connect:
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        submit_to_testflight: true
        submit_to_app_store: false